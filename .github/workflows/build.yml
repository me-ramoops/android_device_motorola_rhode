name: build
on:
  push:
    branches: [5.15]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: deps
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk python3
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          git config --global user.name builder
          git config --global user.email builder@localhost

      - name: sync
        run: |
          export PATH=~/.bin:$PATH
          mkdir twrp && cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          mkdir -p .repo/local_manifests
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<manifest>' '  <project name="Sm6225-Stuff/android_device_motorola_rhode" path="device/motorola/rhode" remote="github" revision="5.15" />' '</manifest>' > .repo/local_manifests/rhode.xml
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: build
        run: |
          cd twrp
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_rhode-eng
          m bootimage -j$(nproc --all)

      - name: fetch boot companions
        run: |
          mkdir -p twrp/out/target/product/rhode/bringup
          cp twrp/out/target/product/rhode/boot.img twrp/out/target/product/rhode/bringup/boot.img
          base=https://github.com/Sm6225-Stuff/android_device_motorola_rhode/releases/download/vendor_boot-fogona-u1tfs34.100-35-14-1-4
          curl -fL --retry 5 "$base/vendor_boot-rhode-5.15.img" -o twrp/out/target/product/rhode/bringup/vendor_boot.img
          curl -fL --retry 5 "$base/dtbo-rhode-stock.img" -o twrp/out/target/product/rhode/bringup/dtbo.img
          printf 'boot: '; test "$(dd if=twrp/out/target/product/rhode/boot.img bs=8 count=1 2>/dev/null)" = 'ANDROID!' && echo ok
          printf 'vendor_boot: '; test "$(dd if=twrp/out/target/product/rhode/bringup/vendor_boot.img bs=8 count=1 2>/dev/null)" = 'VNDRBOOT' && echo ok
          printf 'dtbo: '; test "$(od -An -tx1 -N4 twrp/out/target/product/rhode/bringup/dtbo.img | tr -d ' \n')" = 'd7b7ab1e' && echo ok
          sha256sum twrp/out/target/product/rhode/boot.img twrp/out/target/product/rhode/bringup/*.img > twrp/out/target/product/rhode/bringup/sha256sums

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: twrp-rhode-515
          path: twrp/out/target/product/rhode/bringup
